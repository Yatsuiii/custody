<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DecisionTrace — architecture</title>
<style>
  :root {
    --dt-bg: #f4f3ee; --dt-panel: #fdfcf9; --dt-panel-2: #f8f6f0;
    --dt-line: #e0ddd2; --dt-ink: #1e1c17; --dt-ink-dim: #6b6858;
    --dt-ink-faint: #9b9786; --dt-accent: #3f6e52; --dt-accent-dim: rgba(63,110,82,0.1);
    --dt-danger: #b5432e; --dt-danger-dim: rgba(181,67,46,0.09);
    --dt-amber: #a6741c; --dt-amber-dim: rgba(166,116,28,0.1);
    --dt-mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--dt-bg); }
  body { display: flex; justify-content: center; align-items: center; }
  svg { display: block; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: var(--dt-mono); }
</style>
</head>
<body>
<svg width="2000" height="900" viewBox="0 0 2000 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6e52"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6741c"/>
    </marker>
    <marker id="arrow-faint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9b9786"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6858"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="900" fill="#f4f3ee"/>

  <!-- Title -->
  <text x="70" y="66" font-size="36" font-weight="700" fill="#1e1c17">DecisionTrace</text>
  <text x="70" y="98" font-size="17" fill="#6b6858">Architecture — how a judge's browser reaches Gemini, Firestore, and the deterministic decision graph</text>

  <!-- Zone: Cloud Run -->
  <rect x="230" y="150" width="1150" height="600" rx="14" fill="none" stroke="#d8d4c6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="252" y="180" font-size="12.5" letter-spacing="1.5" fill="#9b9786" font-weight="600">CLOUD RUN — DECISION-TRACE SERVICE (PRODUCT'S OWN CODE)</text>

  <!-- Zone: Google Cloud -->
  <rect x="1430" y="150" width="520" height="600" rx="14" fill="none" stroke="#d8d4c6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1452" y="180" font-size="12.5" letter-spacing="1.5" fill="#9b9786" font-weight="600">GOOGLE CLOUD (MANAGED INFRASTRUCTURE)</text>

  <!-- Browser -->
  <rect x="40" y="430" width="160" height="90" rx="10" fill="#fdfcf9" stroke="#6b6858" stroke-width="1.5"/>
  <text x="120" y="468" font-size="15" text-anchor="middle" fill="#1e1c17" font-weight="600">Browser</text>
  <text x="120" y="488" font-size="12.5" text-anchor="middle" fill="#6b6858">Judge / user</text>

  <!-- GitHub external -->
  <rect x="40" y="640" width="160" height="80" rx="10" fill="#f8f6f0" stroke="#9b9786" stroke-width="1.3"/>
  <text x="120" y="672" font-size="14" text-anchor="middle" fill="#6b6858" font-weight="600">GitHub</text>
  <text x="120" y="690" font-size="11.5" text-anchor="middle" fill="#9b9786">gh CLI, live PRs / KEPs</text>

  <!-- UI -->
  <rect x="270" y="400" width="190" height="90" rx="10" fill="#fdfcf9" stroke="#3f6e52" stroke-width="1.6"/>
  <text x="365" y="432" font-size="14.5" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">app/ui.py</text>
  <text x="365" y="452" font-size="12" text-anchor="middle" fill="#6b6858">Streamlit UI</text>
  <text x="365" y="468" font-size="12" text-anchor="middle" fill="#6b6858">judge-facing frontend</text>

  <!-- ingest.py — supporting infra, toned down relative to the judge-facing read/write story -->
  <rect x="280" y="650" width="170" height="64" rx="9" fill="#f8f6f0" stroke="#c8c4b6" stroke-width="1"/>
  <text x="365" y="674" font-size="12" text-anchor="middle" fill="#9b9786" font-weight="600" class="mono">app/ingest.py</text>
  <text x="365" y="691" font-size="10.5" text-anchor="middle" fill="#9b9786">live GitHub / KEP discovery</text>
  <text x="365" y="705" font-size="10.5" text-anchor="middle" fill="#9b9786">supporting, not core demo path</text>

  <!-- Retrieval -->
  <rect x="540" y="210" width="190" height="90" rx="10" fill="#fdfcf9" stroke="#3f6e52" stroke-width="1.6"/>
  <text x="635" y="240" font-size="13.5" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">retrieval.DecisionIndex</text>
  <text x="635" y="260" font-size="11.8" text-anchor="middle" fill="#6b6858">card-level embedding</text>
  <text x="635" y="276" font-size="11.8" text-anchor="middle" fill="#6b6858">search (not raw docs)</text>

  <!-- Graph (deterministic, distinct) -->
  <rect x="810" y="210" width="190" height="90" rx="10" fill="#fdfcf9" stroke="#1e1c17" stroke-width="2.2"/>
  <text x="905" y="240" font-size="13.5" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">graph.resolve_active()</text>
  <text x="905" y="260" font-size="11.8" text-anchor="middle" fill="#6b6858">deterministic lifecycle</text>
  <text x="905" y="276" font-size="11.8" text-anchor="middle" fill="#6b6858">resolver</text>
  <!-- scope tick, strictly within Graph's own x-range, box below y=300 -->
  <line x1="830" y1="316" x2="980" y2="316" stroke="#1e1c17" stroke-width="1.3"/>
  <text x="905" y="334" font-size="11" text-anchor="middle" fill="#1e1c17" font-weight="600">plain code — no LLM call</text>

  <!-- Collaborate -->
  <rect x="1080" y="210" width="190" height="90" rx="10" fill="#fdfcf9" stroke="#3f6e52" stroke-width="1.6"/>
  <text x="1175" y="240" font-size="13.5" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">collaborate.answer()</text>
  <text x="1175" y="260" font-size="11.8" text-anchor="middle" fill="#6b6858">4-way claim</text>
  <text x="1175" y="276" font-size="11.8" text-anchor="middle" fill="#6b6858">categorization</text>

  <!-- Memory (write path) -->
  <rect x="540" y="640" width="230" height="80" rx="10" fill="#fdfcf9" stroke="#a6741c" stroke-width="1.6"/>
  <text x="655" y="668" font-size="13" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">memory.propose_reconsideration()</text>
  <text x="655" y="686" font-size="11.8" text-anchor="middle" fill="#6b6858">write path — new PROPOSED</text>
  <text x="655" y="701" font-size="11.8" text-anchor="middle" fill="#6b6858">decision + reconsiders edge</text>

  <!-- DecisionStore: the Protocol boundary folded into one node, no separate interface strip -->
  <rect x="810" y="460" width="280" height="90" rx="10" fill="#fdfcf9" stroke="#6b6858" stroke-width="1.5"/>
  <text x="950" y="490" font-size="14" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">DecisionStore</text>
  <text x="950" y="509" font-size="11.5" text-anchor="middle" fill="#6b6858">Protocol &mdash; store.py</text>
  <text x="950" y="526" font-size="11.5" text-anchor="middle" fill="#6b6858">Firestore prod &middot; JSON local</text>

  <!-- Vertex AI: framed as the access layer, not a service wrapping the models -->
  <rect x="1460" y="210" width="220" height="90" rx="10" fill="#f8f6f0" stroke="#6b6858" stroke-width="1.4"/>
  <text x="1570" y="242" font-size="13" text-anchor="middle" fill="#1e1c17" font-weight="700">Vertex AI / Google GenAI SDK</text>
  <text x="1570" y="262" font-size="11.5" text-anchor="middle" fill="#6b6858" class="mono">google-genai</text>
  <text x="1570" y="280" font-size="11" text-anchor="middle" fill="#9b9786">access layer, not a wrapper</text>

  <!-- Gemini / Embedding -->
  <rect x="1740" y="180" width="200" height="60" rx="8" fill="#f8f6f0" stroke="#9b9786" stroke-width="1.2"/>
  <text x="1840" y="205" font-size="12.5" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">gemini-3.7-flash</text>
  <text x="1840" y="222" font-size="11" text-anchor="middle" fill="#6b6858">generation</text>

  <rect x="1740" y="270" width="200" height="60" rx="8" fill="#f8f6f0" stroke="#9b9786" stroke-width="1.2"/>
  <text x="1840" y="295" font-size="12.5" text-anchor="middle" fill="#1e1c17" font-weight="700" class="mono">text-embedding-005</text>
  <text x="1840" y="312" font-size="11" text-anchor="middle" fill="#6b6858">retrieval embeddings</text>

  <!-- Firestore -->
  <rect x="1470" y="460" width="200" height="90" rx="10" fill="#f8f6f0" stroke="#6b6858" stroke-width="1.4"/>
  <text x="1570" y="490" font-size="14" text-anchor="middle" fill="#1e1c17" font-weight="700">Firestore</text>
  <text x="1570" y="510" font-size="11.8" text-anchor="middle" fill="#6b6858">Native mode</text>
  <text x="1570" y="526" font-size="11.5" text-anchor="middle" fill="#6b6858" class="mono">decisiontrace-decisions</text>

  <!-- ===== Edges ===== -->

  <!-- Browser -> UI -->
  <path d="M200,470 C235,460 235,445 268,445" fill="none" stroke="#6b6858" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
  <text x="212" y="435" font-size="11" fill="#6b6858">HTTPS</text>

  <!-- UI -> Retrieval (read path) -->
  <path d="M400,400 C440,330 470,300 538,268" fill="none" stroke="#3f6e52" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <text x="410" y="360" font-size="11.5" fill="#3f6e52" font-style="italic">ask &quot;why...?&quot;</text>

  <!-- Retrieval -> Vertex AI (embed query) -->
  <path d="M730,235 C1050,150 1300,150 1458,235" fill="none" stroke="#3f6e52" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="1000" y="163" font-size="11.5" fill="#3f6e52" font-style="italic">embed query</text>

  <!-- Retrieval -> Store (card similarity search) -->
  <path d="M660,300 C640,380 700,430 940,458" fill="none" stroke="#3f6e52" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="570" y="385" font-size="11.5" fill="#3f6e52" font-style="italic">card similarity search</text>

  <!-- Retrieval -> Graph -->
  <path d="M730,250 C765,250 775,250 808,250" fill="none" stroke="#3f6e52" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <text x="770" y="200" font-size="11" fill="#3f6e52" font-style="italic" text-anchor="middle">candidate cards</text>

  <!-- Graph -> Collaborate -->
  <path d="M1000,250 C1035,250 1045,250 1078,250" fill="none" stroke="#3f6e52" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <text x="1040" y="200" font-size="11" fill="#3f6e52" font-style="italic" text-anchor="middle">active decision context</text>

  <!-- Collaborate -> Vertex AI -->
  <path d="M1270,240 C1360,220 1400,220 1458,248" fill="none" stroke="#3f6e52" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <text x="1290" y="215" font-size="11.5" fill="#3f6e52" font-style="italic">grounded generation</text>

  <!-- Vertex AI -> Gemini / Embedding (internal branch, neutral) -->
  <path d="M1680,240 C1705,225 1712,212 1738,208" fill="none" stroke="#9b9786" stroke-width="1.4" marker-end="url(#arrow-faint)"/>
  <path d="M1680,275 C1705,288 1712,295 1738,298" fill="none" stroke="#9b9786" stroke-width="1.4" marker-end="url(#arrow-faint)"/>

  <!-- Graph -.-> Store (reads only, dashed) -->
  <path d="M880,300 C855,360 840,410 858,458" fill="none" stroke="#3f6e52" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/>
  <text x="680" y="435" font-size="11" fill="#3f6e52" font-style="italic">reads, never writes</text>

  <!-- Store <-> Firestore -->
  <path d="M1090,505 C1250,505 1300,505 1468,505" fill="none" stroke="#6b6858" stroke-width="1.8" marker-end="url(#arrow-ink)" marker-start="url(#arrow-ink)"/>
  <text x="1180" y="497" font-size="11.5" fill="#6b6858">save / get / list_all</text>

  <!-- UI -> Memory (write path) -->
  <path d="M340,490 C320,560 400,610 470,632" fill="none" stroke="#a6741c" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="330" y="580" font-size="11.5" fill="#a6741c" font-style="italic">record reconsideration</text>

  <!-- Memory -> Store -->
  <path d="M770,650 C900,610 920,570 920,552" fill="none" stroke="#a6741c" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="900" y="600" font-size="11.5" fill="#a6741c" font-style="italic">write PROPOSED decision</text>

  <!-- UI -> ingest.py, lighter (supporting infra) -->
  <path d="M365,490 C365,545 365,585 365,648" fill="none" stroke="#c8c4b6" stroke-width="1.3" marker-end="url(#arrow-faint)"/>
  <text x="375" y="570" font-size="10.5" fill="#9b9786" font-style="italic">live ingest panel</text>

  <!-- ingest.py -> GitHub -->
  <path d="M278,684 C250,684 225,684 202,684" fill="none" stroke="#c8c4b6" stroke-width="1.3" marker-end="url(#arrow-faint)"/>

  <!-- ingest.py -> Store (curve below Memory to avoid its box) -->
  <path d="M450,705 C700,770 780,760 855,548" fill="none" stroke="#c8c4b6" stroke-width="1.3" marker-end="url(#arrow-faint)"/>
  <text x="560" y="765" font-size="10.5" fill="#9b9786" font-style="italic">save_many() new decisions</text>

  <!-- ===== Caption ===== -->
  <text x="70" y="852" font-size="12.5" fill="#9b9786">Dashed zone borders separate the product's own code (Cloud Run) from managed Google Cloud infrastructure. Green = read path, amber = write path, grey = ingest/external.</text>

</svg>
</body>
</html>
